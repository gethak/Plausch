# Basic request/connection rate limiting so a flood of traffic (accidental
# or a DDoS) gets throttled by nginx per-IP instead of being served at full
# speed indefinitely. Static-site page loads pull a small, bounded set of
# assets (HTML, CSS, one JS bundle, a handful of images), so the burst
# allowance below is sized generously above that for real users while still
# capping obvious abuse.
limit_req_zone $binary_remote_addr zone=req_limit:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;

        limit_req zone=req_limit burst=40 nodelay;
        limit_req_status 429;

        limit_conn conn_limit 20;
        limit_conn_status 429;
    }
}
